
name: Update ERCOT Website

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 14 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install gridstatusio pandas jupyter ipykernel

      - name: Download ERCOT prices
        env:
          GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
        run: python scripts/update_ercot.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish website
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
